[project]
name = "Test-Script-AI-Generator"
version = "0.1.0"
description = "A python application that use GenAI to generate a test script for a given test case"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[[project.authors]]
name = "esproenca"
email = "eduardo.proenca@parceiros.nos.pt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
src = ["src"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv"
]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "B",
    "D",
    "N",
    "A",
    "G",
    "FA",
    "C4",
    "UP",
    "TC",
    "SIM",
    "ANN",
    "RUF",
    "SIM",
    "ARG",
    "PTH",
    "RET",
    "DTZ",
    "PIE",
    "PLE",
    "LOG",
    "PGH",
    "SLF",
    "RSE",
    "FLY",
    "ASYNC",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"